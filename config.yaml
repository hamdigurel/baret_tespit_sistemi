# URETIM MAKINESI: 12GB VRAM'lik GPU. Bu kart tum 12 kamerayi ayni anda
# guvenle kaldirabilecek seviyede oldugu icin sinir kaldirildi (0 = sinirsiz).
# Panel acikken "Sistem" penceresinden VRAM kullanimini izlemeye devam et -
# eger VRAM dolmaya baslarsa (baska yazilimlar da ayni karti paylasiyorsa
# ya da ileride kamera sayisi artarsa) burayi tekrar bir sayiya (orn. 8-10)
# cekip kapasiteyi sinirlayabilirsin - kod tarafinda baska hicbir sey
# degismez, "sirada" bekleyen kameralar otomatik devreye girer.
# (Eski 4GB'lik test laptopunda bu deger 3 idi - orada VRAM yetersizdi.)
max_aktif_kamera: 0
model:
  mode: head_first
  head_model: models/best.pt
  head_imgsz:
  - 1280
  - 1920
  head_merge_px: 12
  head_conf: 0.15
  min_head_px: 5
  use_person_boxes: false
  person_gate: true
  person_gate_every: 5
  coco_model: models/yolo11m.pt
  person_conf: 0.1
  person_imgsz: 1920
  sahi_enabled: false
  sahi_slice: 640
  sahi_overlap: 0.2
  sahi_postprocess: NMS
  sahi_postprocess_metric: IOU
  sahi_postprocess_threshold: 0.45
cameras:
# DOCKER YOLLARI: konteyner icinde bu videolar "/app/goruntuler/..." olarak
# gorunuyor (bkz. docker-compose.yml -> volumes). Bu, Windows'taki gercek
# "goruntuler" klasorunu ":ro" (salt okunur) olarak konteynerin icine
# baglayan bir "mount". ONEMLI: klasor adi ASCII olmali (goruntuler, "ö/ü"
# OLMADAN) - Docker Desktop'in Windows<->WSL2 yol donusumu Turkce
# karakterli klasor adlarinda calismiyor ("Baglanti yok" / mount hatasi
# veriyor). Yani Desktop'taki "görüntüler" klasorunu BIR KERE "goruntuler"
# olarak yeniden adlandirman gerekiyor (icindeki dosya adlarina dokunma,
# onlar boyle kalabilir) - bkz. sohbetteki adim adim talimat.
- id: dis-depo
  name: Dış Depo
  url: /app/goruntuler/Dış depo.mp4
  enabled: true
  mesafe: normal
- id: hangar-giris
  name: Hangar Giriş
  url: /app/goruntuler/Hangar giriş.mp4
  enabled: true
  mesafe: normal
- id: hangar-giris-2
  name: Hangar Giriş 2
  url: /app/goruntuler/Hangar giriş 2.mp4
  enabled: true
  mesafe: normal
- id: hurdalik
  name: Hurdalık
  url: /app/goruntuler/Hurdalık.mp4
  enabled: true
  mesafe: normal
- id: ic-arka-orta
  name: İç Arka Orta
  url: /app/goruntuler/İç arka orta.mp4
  enabled: true
  mesafe: normal
- id: ic-arka-sag
  name: İç Arka Sağ
  url: /app/goruntuler/İç arka sağ.mp4
  enabled: true
  mesafe: normal
- id: ic-arka-sag-2
  name: İç Arka Sağ 2
  url: /app/goruntuler/İç arka sağ2.mp4
  enabled: true
  mesafe: normal
- id: ic-on-sag
  name: İç Ön Sağ
  url: /app/goruntuler/İç ön sağ.mp4
  enabled: true
  mesafe: normal
- id: ic-on-sag-2
  name: İç Ön Sağ 2
  url: /app/goruntuler/İç ön sağ 2.mp4
  enabled: true
  mesafe: normal
- id: ic-on-sol
  name: İç Ön Sol
  url: /app/goruntuler/İç Ön Sol.mp4
  enabled: true
  mesafe: normal
- id: ic-on-sol-2
  name: İç Ön Sol 2
  url: /app/goruntuler/İç ön sol 2.mp4
  enabled: true
  mesafe: normal
- id: on-orta
  name: Ön Orta
  url: /app/goruntuler/On Orta.mp4
  enabled: true
  mesafe: normal
detection:
  # Tum kameralar icin SABIT deger (kamera basina farkli deger verilmiyor -
  # bilerek boyle: tek, tutarli bir kural). 2'den 1'e dusuruldu: GPU yukunu
  # yariya indirir, ama saniyede 1 kontrol hala kisa sureli gecisleri
  # yakalayabilecek kadar sik (5 saniyede 1'e gore cok daha guvenli).
  target_fps: 1
  tracking_enabled: true
  auto_calibrate: true
  cal_reach_head_mult: 3.5
  cal_reach_floor_px: 12
  cal_reach_max_nn_ratio: 0.4
  cal_min_samples: 60
  track_reach_px: 45
  track_iou: 0.25
  track_max_age: 10
  body_w_mult: 2.6
  body_h_mult: 6.0
  inference_lock: true
  # ASAGIDAKI IKI AYAR "batch inference" icin - cok kamerali kurulumlarda
  # gecikmeyi dusurur. batch_wait_ms: kameralarin biriken kareleri TEK GPU
  # cagrisinda birlestirilmeden once beklenecek pencere (milisaniye). Cok
  # dusuk olursa kameralar birbirini yakalayamaz (batching az olur), cok
  # yuksek olursa gereksiz gecikme eklenir. batch_max_size: tek bir GPU
  # cagrisinda en fazla kac karenin birlestirilecegi (VRAM'e gore ayarlanir -
  # 12GB'lik kartlarda 8-16 arasi güvenli). 12 kameranin TAMAMI ayni anda
  # aktifse (max_aktif_kamera: 0) hepsi tek pakette birlesebilsin diye 12
  # yapildi - VRAM zorlanirsa (bkz. panel "Sistem" penceresi) 8'e geri
  # cekilebilir, kod tarafinda baska hicbir sey degismez.
  batch_wait_ms: 25
  batch_max_size: 12
  head_zone_ratio: 0.55
  match_pad_ratio: 0.5
  require_person_match: true
  min_person_h: 14
  min_person_w: 6
  static_suppress: true
  static_min_seconds: 600
  static_min_seconds_unsupported: 120
  static_support_ratio: 0.15
  static_min_occupancy: 0.97
  static_max_dev_heads: 0.18
  static_max_dev_floor_px: 1.0
  static_forget_seconds: 1800
  conflict_resolve: true
  conflict_body_iou: 0.45
  conflict_head_mult: 1.5
  conflict_person_box: true
  helmet_memory: true
  helmet_votes_needed: 2
  helmet_revoke_frames: 4
  log_helmet_revoke: true
  confirm_frames: 3
  violation_min_conf: 0.3
  cooldown_seconds: 90
  state_ttl_seconds: 300
  show_unmatched_person: true
  show_unknown: true
  show_debug: true
storage:
  snapshots_dir: ihlaller
  database: ihlaller.db
  retention_days: 90
  snapshot_mode: both
web:
  host: 0.0.0.0
  port: 8000
  live_view: true
  stream_quality: 70
