# Yeni eklenen test videolari (goruntuler klasorune sonradan konuldu) -
# denemek icin 3 tanesi eklendi, geri kalanlar (yeni_video3/4/5/6.mp4)
# istenirse ayni sekilde eklenebilir.
- id: yeni-1
  name: Yeni Kamera 1
  url: /app/goruntuler/yeni_video.mp4
  enabled: true
  mesafe: normal
- id: yeni-2
  name: Yeni Kamera 2
  url: /app/goruntuler/yeni_video1.mp4
  enabled: true
  mesafe: normal
- id: yeni-3
  name: Yeni Kamera 3
  url: /app/goruntuler/yeni_video2.mp4
