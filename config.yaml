# URETIM MAKINESI: 12GB VRAM'lik GPU. Bu kart tum 12 kamerayi ayni anda
# guvenle kaldirabilecek seviyede oldugu icin sinir kaldirildi (0 = sinirsiz).
# Panel acikken "Sistem" penceresinden VRAM kullanimini izlemeye devam et -
# eger VRAM dolmaya baslarsa (baska yazilimlar da ayni karti paylasiyorsa
# ya da ileride kamera sayisi artarsa) burayi tekrar bir sayiya (orn. 8-10)
# cekip kapasiteyi sinirlayabilirsin - kod tarafinda baska hicbir sey
# degismez, "sirada" bekleyen kameralar otomatik devreye girer.
# (Eski 4GB'lik test laptopunda bu deger 3 idi - orada VRAM yetersizdi.)
max_aktif_kamera: 0
model:
  mode: head_first
  head_model: models/best.pt
  head_imgsz:
  - 1280
  - 1920
  head_merge_px: 12
  head_conf: 0.15
  min_head_px: 5
  use_person_boxes: false
  person_gate: true
  person_gate_every: 5
  coco_model: models/yolo11m.pt
  person_conf: 0.1
  person_imgsz: 1920
  sahi_enabled: false
  sahi_slice: 640
  sahi_overlap: 0.2
  sahi_postprocess: NMS
  sahi_postprocess_metric: IOU
  sahi_postprocess_threshold: 0.45
