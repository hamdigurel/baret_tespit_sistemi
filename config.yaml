detection:
  # Tum kameralar icin SABIT deger (kamera basina farkli deger verilmiyor -
  # bilerek boyle: tek, tutarli bir kural). 2'den 1'e dusuruldu: GPU yukunu
  # yariya indirir, ama saniyede 1 kontrol hala kisa sureli gecisleri
  # yakalayabilecek kadar sik (5 saniyede 1'e gore cok daha guvenli).
  target_fps: 1
  tracking_enabled: true
  auto_calibrate: true
  cal_reach_head_mult: 3.5
  cal_reach_floor_px: 12
  cal_reach_max_nn_ratio: 0.4
  cal_min_samples: 60
  track_reach_px: 45
  track_iou: 0.25
  track_max_age: 10
  body_w_mult: 2.6
  body_h_mult: 6.0
  inference_lock: true
  # ASAGIDAKI IKI AYAR "batch inference" icin - cok kamerali kurulumlarda
  # gecikmeyi dusurur. batch_wait_ms: kameralarin biriken kareleri TEK GPU
  # cagrisinda birlestirilmeden once beklenecek pencere (milisaniye). Cok
  # dusuk olursa kameralar birbirini yakalayamaz (batching az olur), cok
  # yuksek olursa gereksiz gecikme eklenir. batch_max_size: tek bir GPU
  # cagrisinda en fazla kac karenin birlestirilecegi (VRAM'e gore ayarlanir -
  # 12GB'lik kartlarda 8-16 arasi güvenli). 12 kameranin TAMAMI ayni anda
  # aktifse (max_aktif_kamera: 0) hepsi tek pakette birlesebilsin diye 12
  # yapildi - VRAM zorlanirsa (bkz. panel "Sistem" penceresi) 8'e geri
  # cekilebilir, kod tarafinda baska hicbir sey degismez.
  batch_wait_ms: 25
  batch_max_size: 12
  head_zone_ratio: 0.55
  match_pad_ratio: 0.5
  require_person_match: true
  min_person_h: 14
  min_person_w: 6
  static_suppress: true
  static_min_seconds: 600
  static_min_seconds_unsupported: 120
  static_support_ratio: 0.15
  static_min_occupancy: 0.97
  static_max_dev_heads: 0.18
  static_max_dev_floor_px: 1.0
  static_forget_seconds: 1800
  conflict_resolve: true
  conflict_body_iou: 0.45
  conflict_head_mult: 1.5
  conflict_person_box: true
  helmet_memory: true
  helmet_votes_needed: 2
  helmet_revoke_frames: 4
  log_helmet_revoke: true
  confirm_frames: 3
  # ONEMLI: bu deger, bir "baretsiz" tespitinin IHLAL SAYILIP SAYILMAYACAGINI
  # belirler (0.3 -> 0.45 yukseltildi). Bunun altindaki guven skoruna sahip
  # tespitler artik HIC IHLAL OLARAK KAYDEDILMEZ - ne panelde "Inceleme
  # Bekleyen"e duser ne de mail gider. Cok uzak/sisli/bulanik goruntude
  # modelin dusuk guvenle ("%30" gibi) yanlislikla baretsiz sandigi durumlar
  # icin eklendi. DIKKAT: gercekten uzak bir kamerada gercek bir ihlal de
  # dusuk guvenle tespit edilebilir - bu esik cok yukseltilirse gercek
  # ihlaller de kacabilir. Yanlis alarm hala cok geliyorsa biraz daha
  # yukselt (orn. 0.5); gercek ihlaller kaciyor gibiyse biraz dusur.
  violation_min_conf: 0.45
  cooldown_seconds: 90
  state_ttl_seconds: 300
  show_unmatched_person: true
  show_unknown: true
  show_debug: true
storage:
  snapshots_dir: ihlaller
  database: ihlaller.db
  retention_days: 90
  snapshot_mode: both
web:
  host: 0.0.0.0
  port: 8000
  live_view: true
  stream_quality: 70
# IHLAL MAIL BILDIRIMI - yonetici istegi: ihlal tespit edildiginde mail
# gitsin (kamera, tarih, saat, foto). VARSAYILAN KAPALI (enabled: false) -
# once alttaki bilgileri doldurup deneyerek acmani oneririm, yoksa su anki
# test videolarindaki YUZLERCE birikmis ihlal icin (min_seconds_between
# kadar araliklarla) mail gitmeye baslar.
email:
  enabled: true
  smtp_host: smtp.gmail.com
  smtp_port: 587
  # Gonderen Gmail adresi. NOT: buraya normal Gmail sifreni DEGIL, Google
  # hesabinda 2 adimli dogrulamayi actiktan sonra
  # https://myaccount.google.com/apppasswords adresinden olusturacagin
  # 16 haneli "uygulama sifresi"ni yazmalisin.
  smtp_user: "tespitsistemibaret@gmail.com"
  smtp_pass: "pejz iuyh zxot uwyk"
  to:
    - "hamdigurel50@gmail.com"   # ihlal mailinin gidecegi adres (yoneticinin maili)
  # SPAM ONLEME KURALI: Bir kameradan mail gittikten sonra, ayni kameradan
  # gelen YENI bir ihlal, "ayni kisi" sayilirsa (asagidaki
  # same_person_similarity'ye bakan kiyafet/renk kiyaslamasi ile) bu kadar
  # saniye gecmeden tekrar mail atilmaz. AMA gercekten FARKLI (renk
  # olarak farkli gorunen) bir kisi ayni kamerada yakalanirsa, bu sureyi
  # beklemeden HEMEN mail gider. 10 dakika = 600 saniye.
  min_seconds_between: 600
  # "AYNI KISI Mİ" karari icin kullanilan renk-benzerlik esigi (0-1
  # arasi, HSV histogram korelasyonu - ID Takip ozelligiyle ayni yontem).
  # Yeni ihlalin kirpilmis fotografi, yakin zamanda mail gitmis birinin
  # fotografiyla bu orandan FAZLA benzerse "ayni kisi" sayilir ve mail
  # atlanir. DUSURURSEN (orn. 0.4): daha kolay "ayni kisi" sayilir -
  # ayni kisiyi yururken daha iyi yakalar ama BENZER RENKTE kiyafet
  # giyen iki farkli kisiyi de ayni sanma riski artar. ARTIRIRSAN (orn.
  # 0.75): daha "farkli kisi" sayilmaya meyilli olur - farkli kisileri
  # daha iyi ayirir ama ayni kisi isik/aci degisince "yeni kisi"
  # sanilabilir (biraz daha sik mail gelebilir).
  # NOT: Sahada herkes TAM AYNI RENK is kiyafeti giyiyorsa bu yontem
  # sinirli kalir - agir bir yuz/kisi tanima modeli olmadan bunu tam
  # cozmek zor, ama kiyafet rengi birazcik bile farkliysa dogru calisir.
  same_person_similarity: 0.6
  # DUSUK GUVENLI (sinirda/riskli) tespitler icin mail GITMESIN diye ayri
  # bir esik. Panelin kendi ihlal esigi (violation_min_conf, asagida) ile
  # KARISTIRMA: o esigin altindaki hicbir sey zaten ihlal bile sayilmiyor.
  # Bu esik SADECE MAIL icin - ihlal panelde "Inceleme Bekleyen"e YINE
  # duser (hicbir kayit kaybolmaz), sadece guven skoru bunun altindaysa
  # mail atlanir. Ornek: biri %30 guvenle yanlislikla baretsiz sanilirsa
  # (asiri sisli/uzak goruntu gibi) mail GITMEZ ama panelde gorup elle
  # kontrol edebilirsin. Daha az yanlis-alarm maili istersen yukselt (orn.
  # 0.6), daha hicbir ihlali kacirmak istemiyorsan dusur (orn. 0.3).
  min_confidence: 0.5
