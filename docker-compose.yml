# KULLANIM:
#   docker compose up -d --build     -> derle + arka planda baslat (SADECE
#                                        requirements.txt/Dockerfile
#                                        degisince gerekir)
#   docker compose restart           -> hizli yeniden baslat (panel.py,
#                                        detector.py, camera_worker.py,
#                                        static/ degisince YETERLI - asagidaki
#                                        mount'lar sayesinde rebuild gerekmez)
#   docker compose logs -f           -> canli log izle
#   docker compose down              -> durdur
#
# GPU: "gpus: all" satiri konteynerin TUM GPU'lari gormesini saglar.
# Bunun calismasi icin Docker Desktop'ta GPU destegi acik olmali
# (bkz. asagidaki sohbet mesajindaki kurulum notlari).
#
# VOLUME'LER (disaridan baglanan dosya/klasorler): buradaki her satir,
# konteyner icindeki bir yolu, BU BILGISAYARDAKI gercek dosya/klasore
# baglar - yani buradaki dosyalardan biri BU BILGISAYARDA degisince,
# konteynerin icindeki kopya da AYNI ANDA degismis olur (Docker imaji
# YENIDEN DERLENMEDEN). Kod dosyalari (panel.py/detector.py/camera_worker.py)
# Python tarafindan sadece baslangicta belleğe okundugu icin degisiklik
# gormek istersen yine de "docker compose restart" gerekir (rebuild DEGIL -
# saniyeler surer). static/ klasoru ise HER ISTEKTE diskten okunuyor - o
# yuzden static/index.html degisince tarayiciyi yenilemen bile yeterli,
# restart'a bile gerek yok. config.yaml da restart ile yeterli (sadece
# acilista okunuyor).

services:
  baret-panel:
    build: .
    image: baret-sistem:latest
    container_name: baret-panel
    gpus: all
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./panel.py:/app/panel.py
      - ./detector.py:/app/detector.py
      - ./camera_worker.py:/app/camera_worker.py
      - ./database.py:/app/database.py
      - ./mailer.py:/app/mailer.py
      - ./static:/app/static
      - ./models:/app/models
      - ./ihlaller:/app/ihlaller
      - ./ihlaller.db:/app/ihlaller.db
      # 12 gercek kamera kaydinin bulundugu klasor - Desktop'ta, proje
      # klasorunun DISINDA oldugu icin tam yol (mutlak) veriliyor. ":ro"
      # = konteyner bu videolari SADECE OKUR, degistirmez/silmez.
      # config.yaml'daki kamera "url" alanlari bu klasoru
      # "/app/goruntuler/..." olarak gorur (bkz. config.yaml'daki not).
      # ONEMLI: klasor adi ASCII "goruntuler" olmali - "görüntüler" (Turkce
      # karakterli) adiyla mount BASARISIZ oluyordu ("Baglanti yok" hatasi,
      # tum kameralar). Desktop'taki klasoru bir kere "goruntuler" olarak
      # yeniden adlandirdiktan sonra asagidaki satir dogru calisir.
      # Gercek IP kameralara (rtsp://...) gecince bu satir tamamen
      # kaldirilabilir - artik yerel dosyaya ihtiyac kalmaz.
      - "C:/Users/90545/Desktop/goruntuler:/app/goruntuler:ro"
